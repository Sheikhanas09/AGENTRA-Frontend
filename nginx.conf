# ══════════════════════════════════════════════
# Agentra frontend — nginx (sirf build ki hui files deta hai)
# ══════════════════════════════════════════════
# Dockerfile ka doosra marhala isay /etc/nginx/conf.d/default.conf par
# rakhta hai. API calls nginx se NAHI guzartin — browser seedha backend
# ko bhejta hai (VITE_API_URL, build ke waqt pakka).

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # React Router (BrowserRouter): /ceo/dashboard jaisa raasta disk par
    # koi file nahi — nginx index.html de, aur React khud safha dikhaye.
    # Is ke baghair refresh par 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite ki banayi JS/CSS — naam mein hash hota hai (index-DIpRlEu9.js),
    # naya build = naya naam. Isliye browser inhein saal bhar rakh sakta hai.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ka naam kabhi nahi badalta — har dafa taaza lo, warna
    # naye build ke baad browser purani JS ka pata dhoondta rehta.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Text files sukerh kar bhejo (JS ~2 MB -> ~550 KB)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Errors / headers mein nginx ka version mat batao
    server_tokens off;
}
